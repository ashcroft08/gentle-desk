name: release

# Builds the Windows installer from this repository. The build is automated,
# so a release is reproducible and its binary is traceable to this repository.
#
#   - on a v* tag: builds the installer and attaches it to that tag's release.
#   - by hand (workflow_dispatch): builds the installer and keeps it as a run
#     artifact only. Nothing is published.
#
# Update signing (the Tauri updater's own key pair, not Windows code signing):
# when the TAURI_SIGNING_PRIVATE_KEY secret has content, the build also signs the
# installer for the in-app updater and a latest.json manifest is produced next to
# it. With no key the build is the plain unsigned installer, exactly as before.
#
# Windows code signing: the Windows installer is NOT code signed. The SignPath
# Foundation application was declined for lack of public visibility, so
# SmartScreen may warn on install. The updater signature above is separate and
# unaffected.
#
# What's-new notes (S2 of odd/tasks/whats-new-modal.md): latest.json's `notes`
# field carries the BODY of this tag's release, so the app can show what the
# update brings. The body is read from the release at the moment latest.json is
# written, and that is the ordering that matters: the text the maintainer wants
# shown has to be on the release by then. Either create the release (a draft is
# enough) with its body BEFORE the tag is pushed, or edit the release body after
# the fact and re-run this workflow on the same tag - the upload below overwrites
# latest.json with --clobber, so the re-run embeds the edited body. With no
# release, an empty body, or a run that is not a tag, the notes keep the generic
# "Gentle Shell Desktop <version>" line.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    env:
      # Empty when the secret is missing or empty: that is how "no key" is told.
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Check the tag names the version of the app
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Get-Content apps/desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ("${{ github.ref_name }}" -ne "v$version") {
            throw "the tag is ${{ github.ref_name }} but the app version is $version"
          }

      # The updater artifacts need the private key, so asking for them without
      # one would fail the build. The setting goes in through a config FILE:
      # PowerShell mangles inline JSON when it hands it to npx.
      - name: Build the frontend and the installer
        working-directory: apps/desktop
        shell: pwsh
        run: |
          npm ci
          if ($env:TAURI_SIGNING_PRIVATE_KEY) {
            Write-Host "update signing: ON"
            $config = Join-Path $env:RUNNER_TEMP "updater.json"
            '{"bundle":{"createUpdaterArtifacts":true}}' | Set-Content -Path $config -Encoding ascii
            npx tauri build --config $config
          } else {
            Write-Host "update signing: OFF (no TAURI_SIGNING_PRIVATE_KEY)"
            npx tauri build
          }
          if ($LASTEXITCODE -ne 0) { throw "tauri build failed ($LASTEXITCODE)" }

      # GitHub renames spaces in an asset's name to dots, so the files are staged
      # with the dotted name here and the manifest points at exactly that name.
      # RELEASE_TAG is empty on workflow_dispatch: a by-hand run publishes
      # nothing, so it also reads no release body.
      - name: Stage the release files
        id: stage
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          $exe = Get-ChildItem -Path target/release/bundle/nsis/*.exe | Select-Object -First 1
          if (-not $exe) { throw "no installer was produced" }
          $dotted = $exe.Name -replace ' ', '.'
          $stage = Join-Path $env:RUNNER_TEMP "stage"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item $exe.FullName (Join-Path $stage $dotted)

          $hash = (Get-FileHash -Algorithm SHA256 (Join-Path $stage $dotted)).Hash.ToLower()
          "$hash  $dotted" | Set-Content -Path (Join-Path $stage "$dotted.sha256") -Encoding ascii
          "sha256=$hash" >> $env:GITHUB_OUTPUT

          # latest.json must point at the updater artifact and carry the content
          # of its signature. With createUpdaterArtifacts true the NSIS installer
          # is re-used by the updater, so its signature sits next to it as
          # <installer>.exe.sig; the v1-compatible shape is a .nsis.zip with a
          # .nsis.zip.sig. Only a signature for a file that is uploaded is
          # usable, so both shapes are looked for, and a key without a signed
          # artifact fails the build instead of publishing a release no app can
          # update from.
          $sigSource = $null
          $updateName = $null
          if (Test-Path "$($exe.FullName).sig") {
            $sigSource = "$($exe.FullName).sig"
            $updateName = $dotted
          } else {
            $zip = Get-ChildItem -Path target/release/bundle/nsis/*.nsis.zip -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($zip -and (Test-Path "$($zip.FullName).sig")) {
              $sigSource = "$($zip.FullName).sig"
              $updateName = $zip.Name -replace ' ', '.'
            }
          }
          if (-not $sigSource) {
            if ($env:TAURI_SIGNING_PRIVATE_KEY) {
              throw "a signing key was set but no signed updater artifact was produced"
            }
            "signed=false" >> $env:GITHUB_OUTPUT
          } else {
            if ($updateName -ne $dotted) {
              Copy-Item $zip.FullName (Join-Path $stage $updateName)
            }
            Copy-Item $sigSource (Join-Path $stage "$updateName.sig")
            $version = (Get-Content apps/desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version

            # The notes are the release body the maintainer wrote, read here
            # because this step is where latest.json is written (see the note at
            # the top of this file about that ordering). Anything short of a
            # readable, non-empty body - no release yet, no token, gh failing,
            # a body of whitespace - keeps the generic line, so a manifest that
            # carries the updater fields never fails over its text. ConvertTo-Json
            # below escapes the body's own quotes and newlines, and the app reads
            # `notes` as plain text: the paragraphs stay paragraphs.
            $notes = "Gentle Shell Desktop $version"
            if ($env:RELEASE_TAG) {
              # The same probe the publish step uses: a release that does not
              # exist yet is the normal first run, not a failure, so its error
              # text stays quiet here too.
              gh release view $env:RELEASE_TAG *> $null
              if ($LASTEXITCODE -eq 0) {
                $raw = gh release view $env:RELEASE_TAG --json body 2>$null
                if ($LASTEXITCODE -eq 0 -and $raw) {
                  $body = ($raw -join "`n" | ConvertFrom-Json).body
                  if ($body -and $body.Trim()) { $notes = $body.Trim() }
                }
              }
            }
            # The expected probe failure above leaves $LASTEXITCODE set: the
            # fallback handled it, and the step must not inherit the poisoned
            # code at its end (the 0.1.9 first run failed exactly there).
            $global:LASTEXITCODE = 0

            $manifest = [ordered]@{
              version  = $version
              notes    = $notes
              pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
              platforms = [ordered]@{
                'windows-x86_64' = [ordered]@{
                  signature = (Get-Content $sigSource -Raw).Trim()
                  url       = "https://github.com/${{ github.repository }}/releases/download/v$version/$updateName"
                }
              }
            }
            $manifest | ConvertTo-Json -Depth 5 | Set-Content -Path (Join-Path $stage "latest.json") -Encoding utf8
            "signed=true" >> $env:GITHUB_OUTPUT
          }
          "dir=$stage" >> $env:GITHUB_OUTPUT
          Get-ChildItem $stage | ForEach-Object { Write-Host "$($_.Name)  $($_.Length) bytes" }

      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ github.sha }}
          path: ${{ steps.stage.outputs.dir }}
          if-no-files-found: error

      # Only a tag publishes, and only the files built here for it.
      - name: Attach the installer to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "Gentle Shell Desktop $tag" --notes "Built from ${{ github.sha }} by the release workflow."
          }
          $files = Get-ChildItem "${{ steps.stage.outputs.dir }}" | ForEach-Object { $_.FullName }
          gh release upload $tag @files --clobber
