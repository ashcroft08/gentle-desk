name: release

# Builds the Windows installer from this repository, so a release is reproducible
# and the binary comes from an automated build (SignPath requires exactly that
# before it will vouch for the package).
#
#   - on a v* tag: builds the installer and attaches it to that tag's release.
#   - by hand (workflow_dispatch): builds the installer and keeps it as a run
#     artifact only. Nothing is published.
#
# Signing is not wired yet: it needs the SignPath application to be approved
# first, and the org, project and policy identifiers it hands out. Until then the
# installer is unsigned and Windows shows its warning, as the README says.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build the frontend and the installer
        working-directory: apps/desktop
        run: |
          npm ci
          npx tauri build

      - name: Name the installer
        id: artifact
        shell: pwsh
        run: |
          $file = Get-ChildItem -Path target/release/bundle/nsis/*.exe | Select-Object -First 1
          if (-not $file) { throw "no installer was produced" }
          "path=$($file.FullName)" >> $env:GITHUB_OUTPUT
          "name=$($file.Name)" >> $env:GITHUB_OUTPUT
          $hash = (Get-FileHash -Algorithm SHA256 $file.FullName).Hash.ToLower()
          "$hash  $($file.Name)" | Set-Content -Path "$($file.FullName).sha256" -Encoding ascii
          "sha256=$hash" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ github.sha }}
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/nsis/*.exe.sha256
          if-no-files-found: error

      # Only a tag publishes, and only the asset built here for it.
      - name: Attach the installer to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $exe = "${{ steps.artifact.outputs.path }}"
          if (-not (gh release view $tag)) {
            gh release create $tag --title "Gentle Shell Desktop $tag" --notes "Built from ${{ github.sha }} by the release workflow."
          }
          gh release upload $tag $exe "$exe.sha256" --clobber
