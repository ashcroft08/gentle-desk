[package]
name = "gentle-desk-app"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
name = "gentle_desk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
