[package]
name = "gentle-desk-app"
version = "0.1.7"
edition = "2021"
license = "MIT"

[lib]
name = "gentle_desk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dev-dependencies]
# The integration tests fold through `gentle-app`'s public reducer inputs
# directly, and name the runtime/backend types the seam answers with; regular
# dependencies are invisible to test binaries.
gentle-app = { path = "../../../crates/app" }
gentle-backend = { path = "../../../crates/backend" }
gentle-runtime = { path = "../../../crates/runtime" }
# The session list tests read a temporary pi home, never the user's.
tempfile = "3"
# The updater signature guard verifies a committed fixture the way
# `tauri-plugin-updater` does at run time. `minisign-verify` is the verifier that
# plugin already locks, and `base64` 0.21 is already in `Cargo.lock`, so both add
# no new package; they are dev-only and nothing links them into the app.
base64 = "0.21"
minisign-verify = "0.3"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# The message Copy action writes to the system clipboard (T5a). Text only, so
# arboard's default features are off: they add the image path and with it the
# GDI feature of windows-sys, which a text copy never touches. The Tauri
# clipboard plugin is not used (`odd/tasks/tauri-migration-m19.md`, "T5a
# decisions").
arboard = { version = "3", default-features = false }
# Opening a link in the system browser (T5a): no feature is on, and no Tauri
# plugin, for the same reason.
opener = "0.9"
# The link policy parses with the crate the workspace already locks.
url = "2"
gentle-app = { path = "../../../crates/app" }
# The chat host lives in the runtime, and the executor names the backend's own
# `Opened`/host parts to build it lazily; no `crates/*` file is touched by the
# bridge.
gentle-backend = { path = "../../../crates/backend" }
# The chat state the bridge slices are read from: its message roles are mapped
# to the contract's names in `view`, and nothing of it leaves this crate.
gentle-core = { path = "../../../crates/gentle-core" }
gentle-runtime = { path = "../../../crates/runtime" }
# The native folder picker of "Choose an existing folder" (Q1 option A, W3c):
# rfd's Win32 IFileDialog. Its `default` features (xdg-portal, wayland) are the
# Linux backends and its `common-controls-v6` feature is the only one that pulls
# comctl32 v6's TaskDialogIndirect into a test binary, so neither is on.
rfd = { version = "0.17", default-features = false }
tauri = { version = "2", default-features = false, features = ["wry"] }
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
specta = { version = "2.0.0-rc.26", features = ["derive"] }
specta-typescript = "0.0.13"
tauri-specta = { version = "2.0.0-rc.24", features = ["typescript"] }
