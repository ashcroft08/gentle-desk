<!doctype html>
<html lang="en" data-theme="system">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gentle Shell Desktop</title>
    <!-- `system` is the theme of a run that chose none, and it is only the value
         of the first frame: src/main.ts paints the stored theme on this element
         from the first read of the state, before the app mounts, so the window
         never shows another theme's colors first. -->
    <!-- The first frame, before any stylesheet loads: the same dark surface the
         native window is configured with (tauri.conf.json backgroundColor), so
         opening the app never flashes white. src/main.ts repaints the chosen
         theme before the app mounts. -->
    <style>
      html,
      body {
        background: #0e1116;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
