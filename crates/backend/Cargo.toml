[package]
name = "gentle-backend"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Process layer of gentle-desk: launcher resolution and the gentle-shell RPC child process."

[dependencies]
gentle-core = { path = "../gentle-core" }
# The session watcher that the refresh strategy is built on.
notify = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
