[package]
name = "gentle-backend"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Process layer of gentle-desk: launcher resolution and the gentle-shell RPC child process."

[dependencies]
gentle-core = { path = "../gentle-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
# Only the refresh-strategies prototype watches the file system; no shipped
# code depends on it.
notify = "8"

# The prototype's scheduling function is pure and unit-tested, so its example
# is a test target too: `cargo test --workspace` runs those tests.
[[example]]
name = "refresh_strategies"
test = true
