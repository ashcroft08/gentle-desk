[package]
name = "gentle-ui"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "iced desktop UI for gentle-shell: renders gentle-app state and emits intents."

[[bin]]
name = "gentle-desk"
path = "src/main.rs"

[dependencies]
gentle-core = { path = "../gentle-core" }
gentle-app = { path = "../app" }
gentle-backend = { path = "../backend" }
iced = { version = "0.14", features = ["markdown", "highlighter", "tokio"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
