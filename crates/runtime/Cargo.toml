[package]
name = "gentle-runtime"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "UI-agnostic runtime of gentle-desk: chat children, session refresh and startup, shared by the iced window and the Tauri app."

[dependencies]
gentle-core = { path = "../gentle-core" }
gentle-app = { path = "../app" }
gentle-backend = { path = "../backend" }
# The app config file is a versioned JSON document, as the session cache is.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
